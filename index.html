<title>Plan Sketch</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#241f1a; --mut:#7c7066; --line:#ddd5c8;
  --accent:#8a5a2b; --sel:#c0471f; --wall:#3a332c; --ref:#2f6ea8; --sheet:#fffdf8;
  --grid:#e5ded1; --lock:#9a8f80;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  :root{ --bg:#17150f; --panel:#201d16; --ink:#efe8dc; --mut:#9d9185; --line:#38322a;
         --accent:#d79a5b; --sel:#ff8a5c; --wall:#cdc3b4; --ref:#6fb0e6; --sheet:#201d16;
         --grid:#2a251e; --lock:#6d6458; }
}}
:root[data-theme="dark"]{
  --bg:#17150f; --panel:#201d16; --ink:#efe8dc; --mut:#9d9185; --line:#38322a;
  --accent:#d79a5b; --sel:#ff8a5c; --wall:#cdc3b4; --ref:#6fb0e6; --sheet:#201d16;
  --grid:#2a251e; --lock:#6d6458;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{ background:var(--bg); color:var(--ink); font:15px/1.4 ui-sans-serif,system-ui,"Segoe UI",sans-serif;
      display:flex; flex-direction:column; touch-action:none; }
header{ display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line);
        background:var(--panel); }
header b{ font-size:15px; font-weight:650; white-space:nowrap; overflow:hidden;
          text-overflow:ellipsis; flex:1 1 auto; min-width:4.5em; }
/* The setback made this line longer, and a nowrap line with nothing to give squeezed the
   project's NAME down to one letter. The size may be cut; the name he chose may not. */
header .sub{ color:var(--mut); font-size:12px; white-space:nowrap; flex:0 1 auto;
             min-width:0; overflow:hidden; text-overflow:ellipsis; }
.spacer{ flex:1; }
button{ font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line);
        border-radius:9px; padding:7px 11px; cursor:pointer; }
button:active{ transform:translateY(1px); }
button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
button.ghost{ background:transparent; }
button:disabled{ opacity:.4; }
#warn{ display:none; padding:9px 12px; background:var(--sel); color:#fff; font-size:13px; line-height:1.35; }
#warn.on{ display:block; }
/* The modes WRAP when they will not fit - they never scroll out of sight. A control that
   is off the edge of the screen is a control he does not have, and he has no way of knowing
   it is there at all. 90 degrees, Fit and Pan sit outside the wrapping list and never move. */
#tools{ display:flex; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line);
        background:var(--panel); align-items:center; }
#modes{ display:flex; gap:6px; flex:1 1 auto; min-width:0; flex-wrap:wrap; }
#tools button{ flex:0 0 auto; }
@media (max-width:430px){ #tools button{ padding:7px 7px; font-size:14px; } }
#opts{ display:flex; gap:6px; padding:6px 10px; border-bottom:1px solid var(--line);
       background:var(--panel); flex-wrap:wrap; align-items:center; }
#opts button{ flex:0 0 auto; padding:5px 9px; font-size:13px; }
#opts .lbl{ color:var(--mut); font-size:12px; flex:0 0 auto; margin-right:2px; }
/* On a phone the words go and the controls stay. The three colour swatches that used to sit
   off the right-hand edge of this row were controls he did not have. */
@media (max-width:430px){
  #opts .lbl{ display:none; }
  #opts button{ padding:5px 7px; }
  .sw{ width:22px; height:22px; }
}
.sw{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); padding:0; flex:0 0 auto; }
.sw[aria-pressed="true"]{ border-color:var(--ink); }
#stage{ flex:1; position:relative; min-height:0; }
svg{ width:100%; height:100%; display:block; touch-action:none; }
#hint{ position:absolute; left:10px; right:10px; bottom:10px; text-align:center; color:var(--mut);
       font-size:12.5px; pointer-events:none; }
/* THE PANEL. On a phone it comes up from the bottom and is held to half the height, with
   its own scroll - a sheet taller than that hides the drawing it is describing. On anything
   wide it goes down the RIGHT instead, where a plan drawn in the middle of the paper is not
   under it at all. He is at a desk as often as on a phone, and at a desk the old sheet
   covered the very thing he had just selected. */
#sheet{ position:absolute; left:0; right:0; bottom:0; background:var(--sheet); border-top:1px solid var(--line);
        padding:12px 14px 16px; display:none; box-shadow:0 -8px 24px rgba(0,0,0,.14);
        max-height:52%; overflow-y:auto; }
#sheet.on{ display:block; }
@media (min-width:760px){
  #sheet{ left:auto; right:0; top:0; bottom:0; width:330px; max-height:none;
          border-top:none; border-left:1px solid var(--line);
          box-shadow:-8px 0 24px rgba(0,0,0,.12); }
}
#sheet h3{ margin:0 0 8px; font-size:14px; font-weight:650; }
.row{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
input[type=text]{ font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line);
                  border-radius:9px; padding:8px 10px; width:7.5em; }
.err{ color:var(--sel); font-size:12.5px; }
.note{ color:var(--mut); font-size:12.5px; }
#len{ position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:10px;
      padding:6px; display:none; gap:5px; align-items:center; left:10px; bottom:10px; }
#len.on{ display:flex; }
#len input{ width:5.5em; padding:6px 8px; }
#len button{ padding:6px 9px; font-size:14px; }
</style>

<header>
  <b id="pname">—</b>
  <span class="sub" id="psize"></span>
  <span class="spacer"></span>
  <button class="ghost" id="undo" title="Undo">↶</button>
  <button class="ghost" id="menu">Projects</button>
</header>

<div id="warn"></div>

<div id="tools">
  <div id="modes">
    <button data-mode="draw" aria-pressed="true">Draw</button>
    <button data-mode="select" aria-pressed="false">Box</button>
    <button data-mode="trim" aria-pressed="false">Erase</button>
    <button data-mode="join" aria-pressed="false">Join</button>
    <button data-mode="name" aria-pressed="false">Name</button>
  </div>
  <button data-mode="pan" aria-pressed="false" title="Drag the sheet about">&#10021;</button>
  <button id="refbtn" class="ghost" title="Reference lines: hide, lock or clear them">Ref</button>
  <button id="ortho" aria-pressed="true" title="Lock every line to 90 degrees">90&deg;</button>
  <button id="fit" class="ghost">Fit</button>
</div>

<div id="opts"></div>

<div id="stage">
  <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="hint"></div>
  <div id="len">
    <input type="text" id="lenv" inputmode="text" placeholder="10-6">
    <button data-dir="u">↑</button><button data-dir="r">→</button>
    <button data-dir="d">↓</button><button data-dir="l">←</button>
  </div>
  <div id="sheet"></div>
</div>

<script>
"use strict";

/* ============================================================================
   A common plan sketchpad. One app, many projects.

   The model is a LIST OF LINES, not a subdivision of a rectangle. A line is a
   real object: it has a thickness, a kind (wall or reference), a colour and a
   lock. That is what lets a wall be drawn anywhere, trimmed at a crossing, or
   deleted whole - none of which a rectangle-splitting model can do.

   What that costs, said plainly: nothing here guarantees that the lines close
   into rooms. A subdivision model could not produce an open room; this one can.
   Areas are therefore NOT computed. Length, thickness and position are.

   Everything is in INCHES and lands on a half inch. Feet-inches is the only
   way a size is typed or shown.
   ========================================================================== */

var GRID   = 0.5;          // every coordinate lands here
var MINLEN = 3;            // inches: shorter than this is not a line
var THICK  = [4.5, 6, 9];  // the thicknesses a wall may be drawn at
var COLORS = ["#3a332c", "#2f6ea8", "#1d7a4f", "#b4420f", "#7a3fa0", "#9a8f80"];

function inchText(t){ return (t === 4.5 ? "4½" : String(t)) + '"'; }

/* ---- feet-inches TYPED IN. "10" = 10'-0", "10-6"/"10 6"/"10'6" = 10'-6", "126\"" = inches.
   DECIMAL FEET ARE REFUSED. Someone who types 10.3 almost always means 10'-3", and reading it
   as 10.3 feet gives 10'-3 1/2" - a number he never said, on screen and in the record, with
   nothing to show the two had parted. Inches of 12 or more are refused for the same reason. */
function parseFt(s){
  s = String(s).trim().replace(/[’′]/g, "'").replace(/[”″]/g, '"');
  if (!s) return null;
  var m = s.match(/^(\d+(?:\.5)?)\s*"$/);                   // 126"  126.5"
  if (m) return parseFloat(m[1]);
  m = s.match(/^(\d+)\s*(?:'|-|\s)\s*(\d+(?:\.5)?)\s*"?$/); // 10-6, 10'6", 10 6, 5-3.5
  if (m){
    var inch = parseFloat(m[2]);
    return inch >= 12 ? null : parseInt(m[1],10)*12 + inch;
  }
  m = s.match(/^(\d+)\s*'?$/);                              // 10 -> whole feet
  if (m) return parseInt(m[1],10)*12;
  return null;
}
function whyNot(s){
  s = String(s).trim();
  if (/^\d+\.\d+\s*'?$/.test(s)) return "Feet and inches, not decimal feet — 10'-3\" is typed 10-3.";
  if (/^\d+\s*(?:'|-|\s)\s*\d/.test(s)) return "Inches must be under 12, in halves — 11'-3\" is typed 11-3.";
  return "Could not read that size — try 10, or 10-6.";
}
/* QUARTERS, not halves. Every line lands on a half inch, so a LENGTH never needs a quarter.
   A CLEAR GAP does: half of a 4 1/2" wall is 2 1/4", so the space between a 9" wall and a
   partition comes out on a quarter inch however tidily the walls were drawn. Rounding that
   to the nearest half printed a figure a quarter inch from the truth, and a set of figures
   that would not add back up to the wall they were measured between. */
function fmt(v){
  var n = Math.round(v*4)/4, neg = n<0; n = Math.abs(n);
  var f = Math.floor(n/12), i = Math.floor(n - f*12);
  var q = Math.round((n - f*12 - i) * 4);
  if (q === 4){ q = 0; i += 1; }
  if (i >= 12){ i -= 12; f += 1; }
  return (neg?"-":"") + f + "'-" + i + ["", "¼", "½", "¾"][q] + '"';
}
function snap(v){ return Math.round(v / GRID) * GRID; }

/* ---------------------------------------------------------------- geometry */
function len(l){ return Math.sqrt((l.x2-l.x1)*(l.x2-l.x1) + (l.y2-l.y1)*(l.y2-l.y1)); }

// Where do two segments cross? Parameters along each, or null. Parallel lines
// never cross here - two walls lying on each other have no single crossing, and
// inventing one is how a trim eats a wall it was never near.
function segInt(a, b){
  var r1 = a.x2-a.x1, r2 = a.y2-a.y1, s1 = b.x2-b.x1, s2 = b.y2-b.y1;
  var d = r1*s2 - r2*s1;
  if (Math.abs(d) < 1e-9) return null;
  var t = ((b.x1-a.x1)*s2 - (b.y1-a.y1)*s1) / d;
  var u = ((b.x1-a.x1)*r2 - (b.y1-a.y1)*r1) / d;
  if (t < 1e-9 || t > 1-1e-9 || u < -1e-9 || u > 1+1e-9) return null;
  return { t:t, u:u };
}
/* Where would two lines meet if both ran on for ever? `segInt` answers only where they cross
   WITHIN their own lengths, which is the question erase asks. Joining asks the opposite one:
   two walls drawn at an angle usually do not reach each other at all, and the whole point is
   to run them out until they do. Parallel is still no answer - two walls that never converge
   have no corner, however far they run. */
function lineInt(a, b){
  var r1 = a.x2-a.x1, r2 = a.y2-a.y1, s1 = b.x2-b.x1, s2 = b.y2-b.y1;
  var d = r1*s2 - r2*s1;
  if (Math.abs(d) < 1e-9) return null;
  return { t: ((b.x1-a.x1)*s2 - (b.y1-a.y1)*s1) / d,
           u: ((b.x1-a.x1)*r2 - (b.y1-a.y1)*r1) / d };
}

// How far along a line does a point fall, and how far off it?
function project(l, px, py){
  var dx = l.x2-l.x1, dy = l.y2-l.y1, L2 = dx*dx + dy*dy;
  if (L2 < 1e-12) return { t:0, d:Math.sqrt((px-l.x1)*(px-l.x1)+(py-l.y1)*(py-l.y1)) };
  var t = ((px-l.x1)*dx + (py-l.y1)*dy) / L2;
  var c = Math.max(0, Math.min(1, t));
  var qx = l.x1 + c*dx, qy = l.y1 + c*dy;
  return { t:t, d:Math.sqrt((px-qx)*(px-qx)+(py-qy)*(py-qy)) };
}
function at(l, t){ return { x:l.x1 + (l.x2-l.x1)*t, y:l.y1 + (l.y2-l.y1)*t }; }

// Every place OTHER lines cut this one, as parameters along it, 0 and 1 included.
function cutsOf(l, all){
  var cs = [0, 1];
  all.forEach(function(o){
    if (o.id === l.id) return;
    var i = segInt(l, o);
    if (i) cs.push(i.t);
  });
  cs.sort(function(p,q){ return p-q; });
  return cs;
}

/* TRIM. He tapped a point on this line. Find the stretch of it between the two
   nearest crossings and take THAT away, leaving whatever is on either side.
   A line nothing crosses has no stretch to take, so the whole line goes - which
   is the same thing said at the only scale available.
   Returns the pieces that survive (0, 1 or 2 of them). */
function trimAt(l, t0, all){
  var cs = cutsOf(l, all), lo = 0, hi = 1, L = len(l);
  for (var i = 0; i < cs.length-1; i++){
    if (t0 >= cs[i] - 1e-9 && t0 <= cs[i+1] + 1e-9){ lo = cs[i]; hi = cs[i+1]; break; }
  }
  if (hi - lo > 1 - 1e-9) return [];                 // nothing crosses it: all of it goes
  var out = [];
  if (lo * L >= MINLEN){ var a = at(l, lo); out.push({ x1:l.x1, y1:l.y1, x2:a.x, y2:a.y }); }
  if ((1-hi) * L >= MINLEN){ var b = at(l, hi); out.push({ x1:b.x, y1:b.y, x2:l.x2, y2:l.y2 }); }
  return out;
}

/* ============================================================= what faces what

   EVERY FIGURE BELOW IS A CLEAR DISTANCE - face to face, never centre to centre. A wall
   drawn as a line has a real thickness, and the gap a room gives you is the gap between
   the plaster, not between two lines through the middle of the brick. Half a wall at each
   end is 9 inches, and that is how a 10 foot bedroom turns up 9'-3" on site.

   Only walls that run straight up or straight across are measured. A wall at an angle has
   no single distance to anything; a figure invented for it would be a figure he could not
   use, and he would have no way of knowing it was invented. */
function axis(l){
  if (!l || l.kind !== "wall") return null;
  if (Math.abs(l.y1 - l.y2) < 1e-6 && Math.abs(l.x1 - l.x2) > 1e-6) return "h";
  if (Math.abs(l.x1 - l.x2) < 1e-6 && Math.abs(l.y1 - l.y2) > 1e-6) return "v";
  return null;
}
// where the wall runs from and to, and where it sits across that
function span(l, a){
  return a === "h" ? { lo:Math.min(l.x1,l.x2), hi:Math.max(l.x1,l.x2), at:l.y1 }
                   : { lo:Math.min(l.y1,l.y2), hi:Math.max(l.y1,l.y2), at:l.x1 };
}
/* The nearest wall face on ONE side of this one - and only among the walls that actually
   stand in front of it. A wall off at the far end of the plot shares no ground with this
   one; the distance between them is not a room, and printing it would be a number with no
   place on the drawing. dir -1 runs up or left, +1 runs down or right. */
function facing(l, dir){
  var a = axis(l); if (!a) return null;
  var s = span(l, a), me = s.at + dir*l.t/2, best = null;
  lines().forEach(function(o){
    if (o.id === l.id || axis(o) !== a) return;
    var t = span(o, a);
    if (t.hi <= s.lo + 1e-6 || t.lo >= s.hi - 1e-6) return;    // nothing in front of it
    var face = t.at - dir*o.t/2, gap = dir * (face - me);
    if (gap < 1e-6) return;                                    // behind him, or touching
    if (best === null || gap < best.gap) best = { gap:gap, at:face, line:o };
  });
  return best;
}
/* THE BUILDING AGAINST THE LINE IT MAY BE BUILT TO. The outermost face on each side, and
   how far it stands inside the buildable edge. A NEGATIVE figure is the one that matters:
   the building has stepped over the line, and he should see it the moment it happens. */
function edgeGaps(){
  var b = buildRect(), ws = lines(), out = [];
  function side(a, dir, key){
    var best = null;
    ws.forEach(function(l){
      if (axis(l) !== a) return;
      var s = span(l, a), face = s.at + dir*l.t/2;
      if (best === null || dir*(face - best.at) > 0)
        best = { at:face, mid:s.lo + (s.hi - s.lo)*0.2 };    // the same point the held wall uses
    });
    if (!best) return;
    var edge = a === "h" ? (dir < 0 ? b.y0 : b.y1) : (dir < 0 ? b.x0 : b.x1);
    var o = { side:key, gap: dir * (edge - best.at) };
    if (a === "h"){ o.ax = best.mid; o.ay = edge; o.bx = best.mid; o.by = best.at; }
    else          { o.ax = edge; o.ay = best.mid; o.bx = best.at; o.by = best.mid; }
    out.push(o);
  }
  side("h", -1, "top"); side("h", 1, "bottom");
  side("v", -1, "left"); side("v", 1, "right");
  return out;
}
/* THE ROOM AROUND A NAME. From where the name sits, look up, down, left and right until a
   wall stops you, and take the near face of it. That is a width and a depth he can put on
   a drawing, and it is measured, not guessed.
   If any one of the four looks out and finds nothing, there is NO SIZE. An open side means
   the room is not closed, and the honest answer then is to say nothing rather than to
   measure to the edge of the paper and call it a room. */
function roomSizeAt(p){
  var ws = lines();
  function ray(rx, ry){
    var best = Infinity;
    ws.forEach(function(l){
      if (l.kind !== "wall") return;
      var s1 = l.x2-l.x1, s2 = l.y2-l.y1, L = Math.sqrt(s1*s1 + s2*s2);
      if (L < 1e-9) return;
      var d = rx*s2 - ry*s1;
      if (Math.abs(d) < 1e-9) return;                       // the ray runs along it
      var u = ((l.x1-p.x)*ry - (l.y1-p.y)*rx) / d;          // where along the wall
      if (u < -1e-9 || u > 1+1e-9) return;
      var t = ((l.x1-p.x)*s2 - (l.y1-p.y)*s1) / d;          // how far along the ray
      if (t <= 1e-9) return;
      var cos = Math.abs(rx*(-s2) + ry*s1) / L;             // how squarely it is met
      var face = t - (cos > 1e-6 ? (l.t/2)/cos : 0);        // the near face, not the middle
      if (face > 1e-9 && face < best) best = face;
    });
    return best;
  }
  var u = ray(0,-1), d = ray(0,1), le = ray(-1,0), ri = ray(1,0);
  if (!isFinite(u) || !isFinite(d) || !isFinite(le) || !isFinite(ri)) return null;
  var w = le + ri, h = u + d;
  if (w < MINLEN || h < MINLEN) return null;
  return { w:w, h:h };
}
/* Every figure the drawing shows, worked out in one place so that what is tested is what is
   drawn. Two dimensions that land on the same two points are ONE dimension - the wall he is
   holding is often also the outermost wall, and the same gap printed twice in two colours
   reads as two different gaps. */
function allDims(){
  if (!PROJ) return [];
  var b = buildRect(), out = [], seen = {};
  function add(ax, ay, bx, by, c, text){
    if (Math.abs(ax-bx) < 0.25 && Math.abs(ay-by) < 0.25) return;
    var p = [Math.round(ax*2)+":"+Math.round(ay*2), Math.round(bx*2)+":"+Math.round(by*2)].sort();
    var k = p[0] + "|" + p[1];        // the same two points, whichever way round they were given
    if (seen[k]) return;
    seen[k] = 1;
    out.push({ ax:ax, ay:ay, bx:bx, by:by, c:c, text:text, key:k });
  }
  // 1. the wall in his hand: what faces it on either side, and how far off
  var held = selLines();
  if (held.length !== 1 && justDrawn){ var hf = byId(justDrawn); held = hf ? [hf] : []; }
  if (held.length === 1 && axis(held[0])){
    /* Not down the middle of the wall: that is where a room name sits, and a figure written
       on top of a name is two things neither of which can be read. */
    var l = held[0], a = axis(l), s = span(l, a), mid = s.lo + (s.hi - s.lo)*0.2;
    [-1, 1].forEach(function(dir){
      var me = s.at + dir*l.t/2, fa = facing(l, dir), to = null, g = 0;
      if (fa){ to = fa.at; g = fa.gap; }
      else {
        var edge = a === "h" ? (dir < 0 ? b.y0 : b.y1) : (dir < 0 ? b.x0 : b.x1);
        g = dir * (edge - me);
        if (g > 0.25) to = edge;
      }
      if (to === null || g <= 0.25) return;
      if (a === "h") add(mid, me, mid, to, "sel", fmt(g));
      else           add(me, mid, to, mid, "sel", fmt(g));
    });
  }
  // 2. the whole building against the buildable edge
  edgeGaps().forEach(function(e){
    if (Math.abs(e.gap) <= 0.25) return;

        e.gap < 0 ? "over " + fmt(-e.gap) : fmt(e.gap));

  //    walls, so that the two never read as one figure
  var v = sb();
  if (v.t > 0.25) add(PROJ.W*0.14, 0, PROJ.W*0.14, b.y0, "accent", fmt(v.t));
  if (v.b > 0.25) add(PROJ.W*0.14, PROJ.H, PROJ.W*0.14, b.y1, "accent", fmt(v.b));
  if (v.l > 0.25) add(0, PROJ.H*0.14, b.x0, PROJ.H*0.14, "accent", fmt(v.l));
  if (v.r > 0.25) add(PROJ.W, PROJ.H*0.14, b.x1, PROJ.H*0.14, "accent", fmt(v.r));
  return out;
}

/* ---------------------------------------------------------------- the state */
var PROJ = null;                     // the open project
var mode = "draw", thick = 4.5, kind = "wall", color = COLORS[0], ortho = true;
var chain = null, ghost = null, sel = [], undoStack = [], marquee = null;
/* The line he has just put down. He asked to see where a wall stands THE MOMENT HE DROPS IT,
   and at that moment nothing is selected - he is still in Draw. So the last line added keeps
   its figures until the next one takes its place, or until he picks something else up. */
var justDrawn = null;
var selLabel = null;          // the room name being moved or renamed
/* The selection is a LIST. One line and several are the same thing with a different length,
   which is the only way the bulk actions and the single-line sheet can stay one code path. */
function isSel(id){ return sel.indexOf(id) >= 0; }
function selLines(){ return lines().filter(function(l){ return isSel(l.id); }); }
var view = { x:0, y:0, w:100, h:100 };
var db = null, saveTimer = 0;
var INVENTED = null;      // the empty project made for a first visit, droppable if the store has real ones
var sheetKind = null;     // what the bottom sheet is showing, so it can be refreshed in place

function lines(){ return PROJ ? PROJ.lines : []; }
function ops(){ return PROJ ? PROJ.ops : []; }
function nid(p){ return p + (PROJ.seq++); }
function snapshot(){
  return JSON.stringify({ lines: PROJ.lines, ops: PROJ.ops, labels: labels() });
}
function pushState(str){
  undoStack.push(str);
  if (undoStack.length > 80) undoStack.shift();
  document.getElementById("undo").disabled = false;
}
function push(){ pushState(snapshot()); }
function undo(){
  if (!undoStack.length) return;
  var s = JSON.parse(undoStack.pop());
  PROJ.lines = s.lines; PROJ.ops = s.ops; PROJ.labels = s.labels || [];
  sel = []; chain = null; ghost = null; justDrawn = null;
  document.getElementById("undo").disabled = !undoStack.length;
  closeSheet(); draw(); save();
}

/* ------------------------------------------------------------- the projects */
var LSK = "plansketch.v1";
// ONE copy of the list, held here. localStorage is where it is kept BETWEEN visits, not
// where it is kept during one: a browser that refuses storage (private window, blocked
// site data) must still draw. Reading it back on every call made the app lose the project
// it had just created the moment storage threw.
var STATE = (function(){
  try { var s = JSON.parse(localStorage.getItem(LSK)); if (s && s.list) return s; } catch (e){}
  return { list:[], open:null };
})();
function store(){ return STATE; }
/* This refuses to crash when storage refuses the write - losing the drawing on screen because
   the browser would not keep a copy of it would be the worse outcome. What it must not do is
   CONCEAL the refusal. The probe below runs once at load, with a one-byte key; a browser that
   takes one byte at nine in the morning can still refuse 200 KB of walls at noon - quota
   filled, storage revoked, private mode allowing the small write and not the large one. So
   every write reports what happened and the strip appears the moment saving stops, not only
   when it was impossible from the start. It goes away again if a later write succeeds. */
function writeStore(s){
  STATE = s;
  var ok;
  try { localStorage.setItem(LSK, JSON.stringify(s)); ok = true; }
  catch (e){ ok = false; }
  if (ok !== CAN_SAVE){ CAN_SAVE = ok; paintSaveWarning(); }
}

/* Can this copy of the page actually keep anything? Opened straight off a phone's downloads
   the answer is often no - some browsers give a file:// page no storage at all, and the
   writes above swallow their own failure by design, so the app would look like it was saving
   and lose the lot on close. Ask once, by writing a probe and reading it back: a write that
   does not throw is not the same as a write that stays.

   A warning in a chat message is read once and forgotten. This one is on the page, every
   time, until the answer changes. */
var CAN_SAVE = (function(){
  try {
    localStorage.setItem(LSK + ".probe", "1");
    var ok = localStorage.getItem(LSK + ".probe") === "1";
    localStorage.removeItem(LSK + ".probe");
    return ok;
  } catch (e){ return false; }
})();
function paintSaveWarning(){
  var w = document.getElementById("warn");
  if (!w) return;
  var ok = CAN_SAVE || !!db;                 // either the browser keeps it, or the store does
  w.classList.toggle("on", !ok);
  w.textContent = ok ? "" :
    "Nothing here is being saved. Close this page and the drawing is gone. " +
    "Open it from the Claude link, or from a web address, to keep your work.";
}

function newProject(name, W, H){
  return { id:"p"+Date.now(), name:name, W:W, H:H, north:"up",
           sb:{ t:0, r:0, b:0, l:0 }, lines:[], ops:[], labels:[], seq:1 };
}
/* THE BUILDABLE AREA is the plot pulled in by the setback on each side. With no setback
   typed it IS the plot, so a wall put down on a fresh sheet still gets its distance to a
   line - the plot line. Nothing here is left unmeasured for want of a number he has not
   entered yet.
   The four sides are named by the screen: top, right, bottom, left. "Front" and "rear"
   depend on which way the plot faces, and a figure placed on the wrong side of a plan is
   worse than no figure at all. He can see which edge is the top. */
function sb(){
  var v = (PROJ && PROJ.sb) || {};
  return { t:v.t||0, r:v.r||0, b:v.b||0, l:v.l||0 };
}
function buildRect(){
  var v = sb();
  return { x0:v.l, y0:v.t, x1:PROJ.W - v.r, y1:PROJ.H - v.b };
}
function labels(){ if (!PROJ) return []; PROJ.labels = PROJ.labels || []; return PROJ.labels; }
/* Reference lines can be put out of the way as a group. Hidden, they are not drawn, not
   tapped, not caught by a box and offer no corner to snap to - a line he cannot see must
   not be a line he can hit by accident. They are still there, and still in the file. */
function visible(l){ return !(l.kind === "ref" && PROJ && PROJ.refHidden); }
// 10'-0" reads as 10 in a box he is about to type into again; 10'-6" must keep its inches
function fmtShort(v){ return (Math.abs(v % 12) < 0.01) ? String(Math.round(v/12)) : fmt(v); }
function sizeText(){
  if (!PROJ) return "";
  var t = fmt(PROJ.W) + " \u00d7 " + fmt(PROJ.H), v = sb();
  var any = v.t || v.r || v.b || v.l;
  if (any) t += "  \u00b7 setback " + [v.t, v.r, v.b, v.l].map(fmtShort).join(" / ");
  return t;
}
function save(){
  if (!PROJ) return;
  var s = store(), i = -1;
  s.list.forEach(function(p, k){ if (p.id === PROJ.id) i = k; });
  if (i < 0) s.list.push(PROJ); else s.list[i] = PROJ;
  s.open = PROJ.id;
  writeStore(s);
  // the browser holds it; the artifact store is a copy, and a copy that fails
  // must not take the drawing with it.
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    if (!db) return;
    db.doc("projects/" + PROJ.id).set(JSON.parse(JSON.stringify(PROJ))).catch(function(){});
  }, 900);
}

/* ------------------------------------------------------------------ drawing */
var svg = document.getElementById("plan"), NS = "http://www.w3.org/2000/svg";

function px(n){ return n / perInch(); }                 // screen px -> model inches

/* Both of these divide by the size of the drawing area, and until the browser has laid the
   page out that size is ZERO. Dividing by it puts NaN into the view, and NaN reaches the
   screen as a viewBox the browser refuses - a blank page with an error in a console he will
   never open. It showed up only once the page was served from a real address, because the
   pane opened fresh there and the first draw beat the layout. Waiting for a size is the fix;
   guessing one would just be a different wrong number. */
function laidOut(){ var r = rect(); return r.width > 0 && r.height > 0; }
var fitTries = 0;
function fit(){
  if (!PROJ) return;
  if (!laidOut()){                      // pane still opening, or the tab is not showing yet
    if (fitTries++ < 90) requestAnimationFrame(fit);
    return;
  }
  fitTries = 0;
  touched = false;
  var r = rect(), m = Math.max(PROJ.W, PROJ.H) * 0.08 + 12;
  var w = PROJ.W + 2*m, h = PROJ.H + 2*m;
  if (w / h < r.width / r.height) w = h * r.width / r.height; else h = w * r.height / r.width;
  view = { x:(PROJ.W - w)/2, y:(PROJ.H - h)/2, w:w, h:h };
  draw();
}
function syncView(){
  if (!laidOut()) return;
  var r = rect();
  view.h = view.w * r.height / r.width;
}
function viewOk(){
  return isFinite(view.x) && isFinite(view.y) && view.w > 0 && isFinite(view.w) && view.h > 0 && isFinite(view.h);
}
function toModel(cx, cy){
  var r = rect();
  return { x: view.x + (cx - r.left)/r.width * view.w,

}

function opSpans(l){                       // openings on this line, as {a,b} inches from start
  var L = len(l);

    return { o:o, a:Math.max(0, o.at), b:Math.min(L, o.at + o.w) };
  });

function draw(){

  syncView();

  var bg = cs.getPropertyValue("--bg").trim() || "#fff";

      [A, B].forEach(function(P){                               // the jambs
        svg.appendChild(el("line", { x1:P.x - nx*l.t/2, y1:P.y - ny*l.t/2,
          x2:P.x + nx*l.t/2, y2:P.y + ny*l.t/2, stroke:l.color, "stroke-width":thin }));
      });
      var wd = s.b - s.a;
      if (s.o.kind === "door"){
        svg.appendChild(el("path", { d:"M " + A.x + " " + A.y + " L " + (A.x + nx*wd) + " " + (A.y + ny*wd) +
          " A " + wd + " " + wd + " 0 0 1 " + B.x + " " + B.y, fill:"none", stroke:l.color,
          "stroke-width":thin, opacity:"0.85" }));
      } else {
        svg.appendChild(el("line", { x1:A.x, y1:A.y, x2:B.x, y2:B.y, stroke:l.color, "stroke-width":thin }));
      }
      var M = { x:(A.x+B.x)/2 + nx*(l.t/2 + fs*0.9), y:(A.y+B.y)/2 + ny*(l.t/2 + fs*0.9) };
      var tx = el("text", { x:M.x, y:M.y, "font-size":fs, fill:cs.getPropertyValue("--mut").trim(),
        "text-anchor":"middle", "dominant-baseline":"middle" });
      tx.textContent = (s.o.kind === "door" ? "D " : "W ") + fmt(wd);

    });
  });

  // locks
  lines().forEach(function(l){
    if (!l.locked) return;
    var m = at(l, 0.5);
    var c = el("circle", { cx:m.x, cy:m.y, r:px(5), fill:cs.getPropertyValue("--lock").trim(), opacity:"0.9" });
    svg.appendChild(c);
  });

  // the first line picked for a join, so he can see what he is joining to what
  if (joinA && byId(joinA.line.id)){
    var ja = joinA.line;
    svg.appendChild(el("line", { x1:ja.x1, y1:ja.y1, x2:ja.x2, y2:ja.y2,
      stroke:cs.getPropertyValue("--accent").trim(),
      "stroke-width":Math.max(ja.kind === "wall" ? ja.t : 0, px(3)) + px(4),
      opacity:"0.4", "stroke-linecap":"butt" }));

  // dozen selected the figures overlap each other into a smear and say less than nothing.
  var selNow = selLines(), one = selNow.length === 1;
  selNow.forEach(function(l){

      stroke:cs.getPropertyValue("--sel").trim(), "stroke-width":Math.max(l.kind==="wall"?l.t:0, px(3)) + px(3),
      opacity:"0.35", "stroke-linecap":"butt" }));
    if (!one) return;

    var ux2 = (l.x2-l.x1)/L2, uy2 = (l.y2-l.y1)/L2;
    var t2 = el("text", { x:m2.x, y:m2.y, "font-size":fs*1.05,
      fill:cs.getPropertyValue("--sel").trim(), "text-anchor":"middle", "dominant-baseline":"middle",
      transform:"rotate(" + (Math.atan2(uy2, ux2)*180/Math.PI) + " " + m2.x + " " + m2.y + ")" });
    t2.textContent = fmt(L2);

  if (one && !selNow[0].locked){

        fill:cs.getPropertyValue("--sel").trim(), "fill-opacity":"0.8",
        stroke:cs.getPropertyValue("--sel").trim(), "stroke-width":px(1) }));

    [[d.ax,d.ay],[d.bx,d.by]].forEach(function(p){
      svg.appendChild(el("line", { x1:p[0]-nx*tick, y1:p[1]-ny*tick,
        x2:p[0]+nx*tick, y2:p[1]+ny*tick, stroke:c, "stroke-width":px(1) }));
    });
    var tt = el("text", { x:(d.ax+d.bx)/2 + nx*px(9), y:(d.ay+d.by)/2 + ny*px(9),
      "font-size":fs*0.95, fill:c, "text-anchor":"middle", "dominant-baseline":"middle" });
    tt.textContent = d.text;
    svg.appendChild(halo(tt));

  labels().forEach(function(t){
    var size = roomSizeAt(t), lit = selLabel === t.id;
    if (lit) svg.appendChild(el("circle", { cx:t.x, cy:t.y, r:px(13), fill:COL.sel,
      "fill-opacity":"0.14", stroke:COL.sel, "stroke-width":px(1.2) }));
    var nm = el("text", { x:t.x, y:size ? t.y - px(7) : t.y, "font-size":fs*1.15,
      fill:lit ? COL.sel : cs.getPropertyValue("--ink").trim(),

    nm.textContent = t.text || "(name)";
    svg.appendChild(halo(nm));

      fill:cs.getPropertyValue("--sel").trim(), "fill-opacity":xing ? "0.13" : "0.06",

      svg.appendChild(el("line", { x1:g.x1, y1:g.y1, x2:g.x2, y2:g.y2, stroke:gc,
        "stroke-width":px(1), "stroke-dasharray":px(1.5)+" "+px(4.5),
        "stroke-linecap":"round", opacity:"0.85" }));
      svg.appendChild(el("circle", { cx:g.x1, cy:g.y1, r:px(4), fill:"none",
        stroke:gc, "stroke-width":px(1.2), opacity:"0.9" }));
    });
  }

  // what is being drawn right now
  if (ghost){
    svg.appendChild(el("line", { x1:ghost.x1, y1:ghost.y1, x2:ghost.x2, y2:ghost.y2,
      stroke:cs.getPropertyValue("--accent").trim(),

      "stroke-dasharray":px(6)+" "+px(4), "stroke-linecap":"butt", opacity:"0.75" }));
    var gl = len(ghost);
    if (gl > 0.4){
      var gt = el("text", { x:(ghost.x1+ghost.x2)/2, y:(ghost.y1+ghost.y2)/2 - px(14),
        "font-size":fs*1.1, fill:cs.getPropertyValue("--accent").trim(), "text-anchor":"middle" });

    svg.appendChild(el("circle", { cx:chain.x, cy:chain.y, r:px(5), fill:"none",
      stroke:cs.getPropertyValue("--accent").trim(), "stroke-width":px(2) }));
  }

}
function byId(id){ var f = null; lines().forEach(function(l){ if (l.id === id) f = l; }); return f; }

/* ------------------------------------------------------------------ snapping */
