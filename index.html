    ps.push({x:l.x1,y:l.y1}); ps.push({x:l.x2,y:l.y2});
  });
  ps.push({x:0,y:0}, {x:PROJ.W,y:0}, {x:0,y:PROJ.H}, {x:PROJ.W,y:PROJ.H});
  // and the corners of the buildable area, so a wall can be laid ON the setback line
  // instead of near it. With the 90 degree lock on, one of these pulls the whole wall
  // onto the line it is allowed to touch.
  var b = buildRect();
  ps.push({x:b.x0,y:b.y0}, {x:b.x1,y:b.y0}, {x:b.x0,y:b.y1}, {x:b.x1,y:b.y1});
  return ps;
}
/* With the 90 degree lock ON, STRAIGHT WINS. Nothing bends the line - not a corner sitting
   a few pixels off the axis, not anything else. The first version let the endpoint snap
   return before ortho was ever applied, so on a plan with corners everywhere almost every
   tap came out crooked by a half inch or two: the lock was there and it lost every argument.

   What a corner may still do is say WHERE ALONG the line to stop. Lining a new wall up with
   one across the room is the whole reason to want the lock, so an endpoint pulls the far end
   in or out along the locked axis and never off it. */
/* TRACKING. A point directly above, below, left or right of an end already on the drawing
   is nearly always the point he meant - the wall that carries on where another one stopped,
   the partition that lines up with the one across the room. Finding that by eye on a phone
   is hopeless, so the point is pulled onto the line of that end and a DASHED GUIDE is drawn
   back to it saying which end it found.
   The guide is not decoration. A snap that moves the point without saying why is a point he
   did not place, and he would only find out by measuring it afterwards. */
var guides = [];
function snapPoint(p, from){
  guides = [];
  var near = px(14), best = null, bd = near;
  if (from && ortho){
    var horiz = Math.abs(p.x - from.x) >= Math.abs(p.y - from.y);
    var x = horiz ? p.x : from.x, y = horiz ? from.y : p.y;
    endpoints().forEach(function(q){
      var d = horiz ? Math.abs(q.x - x) : Math.abs(q.y - y);
      if (d < bd){ bd = d; best = q; }
    });
    if (best){
      if (horiz) x = best.x; else y = best.y;
      guides.push({ x1:best.x, y1:best.y, x2:snap(x), y2:snap(y) });
    }
    return { x:snap(x), y:snap(y) };
  }
  endpoints().forEach(function(q){                 // a corner within reach beats everything
    var d = Math.sqrt((q.x-p.x)*(q.x-p.x) + (q.y-p.y)*(q.y-p.y));
    if (d < bd){ bd = d; best = q; }
  });
  if (best) return { x:snap(best.x), y:snap(best.y) };

  // no corner near: line it up with one anyway, up or down, left or right
  var gx = null, gy = null, bx = near, by = near;
  endpoints().forEach(function(q){
    var dx = Math.abs(q.x - p.x), dy = Math.abs(q.y - p.y);
    if (dx < bx){ bx = dx; gx = q; }
    if (dy < by){ by = dy; gy = q; }
  });
  var X = gx ? gx.x : p.x, Y = gy ? gy.y : p.y;
  if (gx) guides.push({ x1:gx.x, y1:gx.y, x2:snap(X), y2:snap(Y) });
  if (gy) guides.push({ x1:gy.x, y1:gy.y, x2:snap(X), y2:snap(Y) });
  return { x:snap(X), y:snap(Y) };
}

/* THE ENDS OF THE CHOSEN LINE, as something to take hold of. Stretching a wall that is
   already there beats drawing it again: it keeps its thickness, its colour, its lock and
   the doors already cut into it. */
function gripAt(p){
  var s = selLines();
  if (s.length !== 1 || s[0].locked) return null;
  var l = s[0], tol = px(13);
  var d1 = Math.sqrt((l.x1-p.x)*(l.x1-p.x) + (l.y1-p.y)*(l.y1-p.y));
  var d2 = Math.sqrt((l.x2-p.x)*(l.x2-p.x) + (l.y2-p.y)*(l.y2-p.y));
  if (d1 > tol && d2 > tol) return null;
  return { l:l, end:(d1 <= d2 ? 1 : 2), was:{ x1:l.x1, y1:l.y1, x2:l.x2, y2:l.y2 } };
}
function gripMove(g, m){
  var l = g.l, anchor = g.end === 1 ? { x:l.x2, y:l.y2 } : { x:l.x1, y:l.y1 };
  var q = snapPoint(m, anchor);
  if (Math.sqrt((q.x-anchor.x)*(q.x-anchor.x) + (q.y-anchor.y)*(q.y-anchor.y)) < MINLEN) return false;
  if (g.end === 1){
    if (q.x === l.x1 && q.y === l.y1) return false;
    l.x1 = q.x; l.y1 = q.y;
  } else {
    if (q.x === l.x2 && q.y === l.y2) return false;
    l.x2 = q.x; l.y2 = q.y;
  }
  return true;
}
/* An opening is measured from the line's FIRST end. Drag that end and every door on the wall
   is measured from somewhere else, so they are re-measured once, at the end of the drag -
   and any that no longer fits is removed AND COUNTED. */
function gripDone(g){
  var l = g.l, w = g.was;
  var L0 = Math.sqrt((w.x2-w.x1)*(w.x2-w.x1) + (w.y2-w.y1)*(w.y2-w.y1));
  if (L0 < 1e-9) return 0;
  var ux = (w.x2-w.x1)/L0, uy = (w.y2-w.y1)/L0;
  return reflowOpenings(l, (l.x1 - w.x1)*ux + (l.y1 - w.y1)*uy);
}

/* -------------------------------------------------------------- the actions */
function addLine(a, b){
  var l = { id:nid("l"), x1:snap(a.x), y1:snap(a.y), x2:snap(b.x), y2:snap(b.y),
            t:thick, kind:kind, color:color, locked:false };
  if (len(l) < MINLEN) return null;
  push(); lines().push(l); justDrawn = l.id; save(); return l;
}
function hit(p){
  var tol = px(13), best = null, bd = 1e9;
  lines().forEach(function(l){
    if (!visible(l)) return;
    var pr = project(l, p.x, p.y);
    if (pr.t < -0.02 || pr.t > 1.02) return;
    var d = pr.d - (l.kind === "wall" ? l.t/2 : 0);
    if (d < tol && d < bd){ bd = d; best = { line:l, t:Math.max(0, Math.min(1, pr.t)) }; }
  });
  return best;
}
function labelAt(p){
  var tol = px(22), best = null, bd = 1e9;
  labels().forEach(function(t){
    var d = Math.sqrt((t.x-p.x)*(t.x-p.x) + (t.y-p.y)*(t.y-p.y));
    if (d < tol && d < bd){ bd = d; best = t; }
  });
  return best;
}
function doTrim(p){
  var h = hit(p);
  if (!h) return;
  if (h.line.locked){ flash("That line is locked. Unlock it first."); return; }
  push();
  var pieces = trimAt(h.line, h.t, lines());
  var i = lines().indexOf(h.line);
  var made = pieces.map(function(q){
    return { id:nid("l"), x1:snap(q.x1), y1:snap(q.y1), x2:snap(q.x2), y2:snap(q.y2),
             t:h.line.t, kind:h.line.kind, color:h.line.color, locked:false };
  });
  // A door sitting on a stretch that survived must survive with it. Dropping every opening
  // on a trimmed wall is quick and quiet, and quiet is the fault: he would come back to a
  // plan with a door missing and nothing to say when it went.
  var keep = [];
  ops().forEach(function(o){
    if (o.line !== h.line.id){ keep.push(o); return; }
    var a = o.at, b = o.at + o.w;
    made.forEach(function(m){
      var s0 = Math.sqrt((m.x1-h.line.x1)*(m.x1-h.line.x1) + (m.y1-h.line.y1)*(m.y1-h.line.y1));
      var s1 = s0 + len(m);
      if (a >= s0 - 1e-6 && b <= s1 + 1e-6)
        keep.push({ id:o.id, line:m.id, kind:o.kind, at:snap(a - s0), w:o.w });
    });
  });
  PROJ.ops = keep;
  lines().splice(i, 1);
  made.forEach(function(m){ lines().push(m); });
  sel = []; closeSheet(); save(); draw();
}
/* JOIN (a fillet of no radius). Two lines at any angle, each tapped once: both run out to
   where they meet, or back to it, and the corner closes exactly. The END THAT GOES is the one
   away from where he tapped - the same rule as every drafting program, and the only one that
   needs no further question.

   `corner(l, tPick, tI)` edits one line. Both get the SAME snapped point, so the two ends sit
   on the same coordinate rather than a half inch apart looking closed.  */
function corner(l, tPick, tI){
  var P = at(l, tI), before = len(l);
  var sx = snap(P.x), sy = snap(P.y), moved = 0;
  if (tPick <= tI){ l.x2 = sx; l.y2 = sy; }                 // keep the side he tapped
  else { moved = tI * before; l.x1 = sx; l.y1 = sy; }
  return moved;                                             // how far the START shifted, in inches
}
function joinLines(A, tA, B, tB){
  if (A.id === B.id) return "Tap two different lines.";
  if (A.locked || B.locked) return "One of those is locked. Unlock it first.";
  var i = lineInt(A, B);
  if (!i) return "Those two are parallel — they never meet.";

  // refuse before changing anything, so a refusal leaves the drawing exactly as it was
  var la = len(A), lb = len(B);
  var keepA = tA <= i.t ? i.t * la : (1 - i.t) * la;
  var keepB = tB <= i.u ? i.u * lb : (1 - i.u) * lb;
  if (keepA < MINLEN || keepB < MINLEN) return "That would leave nothing of one of them.";
  var reach = Math.max(Math.abs(i.t - 0.5), Math.abs(i.u - 0.5)) - 0.5;
  if (reach > 4) return "They would have to run a long way to meet. Draw them closer first.";

  push();
  var shiftA = corner(A, tA, i.t), shiftB = corner(B, tB, i.u);
  var lost = reflowOpenings(A, shiftA) + reflowOpenings(B, shiftB);
  save();
  return lost ? ("Joined. " + lost + (lost === 1 ? " opening no longer fits and was removed."
                                                 : " openings no longer fit and were removed.")) : null;
}
/* An opening is measured from its line's first end. Move that end and every opening on it is
   measured from somewhere else - so they are re-measured here, and any that no longer fits on
   the shortened wall is removed AND COUNTED, never quietly dropped. */
function reflowOpenings(l, shift){
  var L = len(l), lost = 0;
  PROJ.ops = ops().filter(function(o){
    if (o.line !== l.id) return true;
    o.at = snap(o.at - shift);
    if (o.at < 0 || o.at + o.w > L + 1e-6){ lost++; return false; }
    return true;
  });
  return lost;
}

/* THE BOX, BOTH WAYS ROUND - the rule every drafting program uses, and the one he already
   has in his hands from AutoCAD:

     dragged LEFT to RIGHT   only what is WHOLLY inside - both ends, not one
     dragged RIGHT to LEFT   everything the box TOUCHES, however little of it is in there

   Both are wanted and they are wanted at different moments. Picking up a whole room means
   catching nothing of the room next door, so the box must stop at the ends. Picking up
   every wall along one side of a plan means catching walls that run far out of the box, so
   it must not. The direction of the drag is the only thing that can say which he meant, and
   it costs no button and no mode.

   A locked line is picked up by neither: it is locked against being changed, and sweeping
   it into a selection is how it would be changed without anyone choosing to. */
function inBox(l, b){
  var lo = { x:Math.min(b.x0, b.x1), y:Math.min(b.y0, b.y1) },
      hi = { x:Math.max(b.x0, b.x1), y:Math.max(b.y0, b.y1) };
  return l.x1 >= lo.x && l.x1 <= hi.x && l.y1 >= lo.y && l.y1 <= hi.y &&
         l.x2 >= lo.x && l.x2 <= hi.x && l.y2 >= lo.y && l.y2 <= hi.y;
}
function segCross(a, b){
  var r1=a.x2-a.x1, r2=a.y2-a.y1, s1=b.x2-b.x1, s2=b.y2-b.y1;
  var d = r1*s2 - r2*s1;
  if (Math.abs(d) < 1e-9) return false;
  var t = ((b.x1-a.x1)*s2 - (b.y1-a.y1)*s1) / d;
  var u = ((b.x1-a.x1)*r2 - (b.y1-a.y1)*r1) / d;
  return t >= -1e-9 && t <= 1+1e-9 && u >= -1e-9 && u <= 1+1e-9;
}
function touchesBox(l, b){
  var lo = { x:Math.min(b.x0, b.x1), y:Math.min(b.y0, b.y1) },
      hi = { x:Math.max(b.x0, b.x1), y:Math.max(b.y0, b.y1) };
  function inside(x, y){ return x >= lo.x && x <= hi.x && y >= lo.y && y <= hi.y; }
  if (inside(l.x1, l.y1) || inside(l.x2, l.y2)) return true;
  var e = [ { x1:lo.x, y1:lo.y, x2:hi.x, y2:lo.y }, { x1:hi.x, y1:lo.y, x2:hi.x, y2:hi.y },
            { x1:hi.x, y1:hi.y, x2:lo.x, y2:hi.y }, { x1:lo.x, y1:hi.y, x2:lo.x, y2:lo.y } ];
  for (var i = 0; i < 4; i++) if (segCross(l, e[i])) return true;
  return false;
}
function crossingBox(b){ return b.x1 < b.x0; }        // dragged right to left
function selectIn(b){
  var cross = crossingBox(b), test = cross ? touchesBox : inBox;
  var pick = lines().filter(function(l){ return visible(l) && test(l, b); });
  var caught = pick.filter(function(l){ return !l.locked; });
  var locked = pick.length - caught.length;
  sel = caught.map(function(l){ return l.id; });
  showSheet();
  var how = cross ? "everything it touched" : "only what was wholly inside";
  if (!caught.length) flash(locked ? "Only locked lines in there." : "Nothing in that box.");
  else flash(caught.length + " picked up - the box took " + how +
             (locked ? ". " + locked + " locked line" + (locked === 1 ? " was" : "s were") +
                       " left alone." : "."));
}

var joinA = null;                 // the first line tapped with Join, waiting for its partner
function doJoin(p){
  var h = hit(p);
  if (!h){ joinA = null; draw(); return; }
  if (!joinA){ joinA = h; draw(); flash("Now tap the line to join it to."); return; }
  var msg = joinLines(joinA.line, joinA.t, h.line, h.t);
  joinA = null;
  if (msg) flash(msg);
  sel = []; closeSheet(); draw();
}

function removeLine(l){
  push();
  PROJ.ops = ops().filter(function(o){ return o.line !== l.id; });
  lines().splice(lines().indexOf(l), 1);
  sel = []; closeSheet(); save(); draw();
}
// type a length: the far end moves along the line it already has
function setLength(l, L){
  if (L < MINLEN) return false;
  var d = len(l), ux = (l.x2-l.x1)/d, uy = (l.y2-l.y1)/d;
  push();
  l.x2 = snap(l.x1 + ux*L); l.y2 = snap(l.y1 + uy*L);
  save(); return true;
}
function moveLine(l, dx, dy){
  l.x1 = snap(l.x1+dx); l.y1 = snap(l.y1+dy);
  l.x2 = snap(l.x2+dx); l.y2 = snap(l.y2+dy);
}

/* ------------------------------------------------------------ openings on a wall */
function addOpening(l, k, w, from){
  var L = len(l);
  if (w < 6 || from < 0 || from + w > L) return false;
  push();
  ops().push({ id:nid("o"), line:l.id, kind:k, at:snap(from), w:snap(w) });
  save(); return true;
}

/* ------------------------------------------------------------------- pointer */
var ptrs = {}, pan0 = null, pinch0 = null, down = null, moved = false, dragging = null;
var dragLabel = null;
var grip = null;              // an end of the chosen line, being dragged out or back
var touched = false;   // has he zoomed or panned himself? until he has, a resize re-fits

svg.addEventListener("pointerdown", function(e){
  svg.setPointerCapture(e.pointerId);
  ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
  var n = Object.keys(ptrs).length;
  if (n === 2){
    var k = Object.keys(ptrs), a = ptrs[k[0]], b = ptrs[k[1]];
    pinch0 = { d:Math.hypot(a.x-b.x, a.y-b.y), w:view.w,
               c:toModel((a.x+b.x)/2, (a.y+b.y)/2), vx:view.x, vy:view.y };
    chain = null; ghost = null; down = null; dragging = null; draw();
    return;
  }
  if (n > 2) return;
  down = { cx:e.clientX, cy:e.clientY, m:toModel(e.clientX, e.clientY) };
  moved = false;
  /* Where the line will REALLY begin, worked out now and used for everything after.
     The start snaps to a corner if one is near; squaring the far end to his raw finger
     instead of to that corner is how a line begun on an existing corner came out slanted
     with the 90 degree lock on - and the preview, squared the same wrong way, agreed with
     it all the way to the release. */
  /* ONE MODE FOR DRAWING AND FOR PICKING UP. He asked for it plainly: hold the button down
     and drag and a wall goes in; click on a wall that is already there and it is picked up.
     Two buttons to swap between those was two buttons too many, and swapping them is not
     work - it is the absence of work, done over and over. */
  if (mode === "draw"){
    down.s = snapPoint(down.m, null);
    if (!chain){
      var g0 = gripAt(down.m);                       // an end of the chosen wall: stretch it
      if (g0){ g0.snap = snapshot(); grip = g0; return; }
      var hd = hit(down.m);                          // already chosen: drag the lot
      if (hd && isSel(hd.line.id)){
        var mv = selLines().filter(function(l){ return !l.locked; });
        if (mv.length){ dragging = { set:mv, from:down.m }; return; }
      }
    }
  }
  if (mode === "pan"){ pan0 = { x:view.x, y:view.y }; return; }
  if (mode === "name"){ dragLabel = labelAt(down.m); return; }
  if (mode === "select"){
    var h = hit(down.m);
    // On something already chosen: drag the WHOLE selection. On bare paper: start a box.
    if (h && isSel(h.line.id)){
      var movable = selLines().filter(function(l){ return !l.locked; });
      if (movable.length) dragging = { set:movable, from:down.m };
    } else if (!h){
      marquee = { x0:down.m.x, y0:down.m.y, x1:down.m.x, y1:down.m.y };
    }
  }
});

svg.addEventListener("pointermove", function(e){
  if (!(e.pointerId in ptrs)) return;
  ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
  if (pinch0){
    var k = Object.keys(ptrs);
    if (k.length < 2) return;
    var a = ptrs[k[0]], b = ptrs[k[1]], d = Math.hypot(a.x-b.x, a.y-b.y);
    var f = Math.max(0.15, Math.min(8, pinch0.d / Math.max(1, d)));
    view.w = Math.max(24, Math.min(Math.max(PROJ.W, PROJ.H)*6, pinch0.w * f));
    syncView();
    var r = rect(), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    view.x = pinch0.c.x - (mx - r.left)/r.width * view.w;
    view.y = pinch0.c.y - (my - r.top)/r.height * view.h;
    touched = true;
    draw();
    return;
  }
  if (!down) return;
  if (Math.hypot(e.clientX-down.cx, e.clientY-down.cy) > 6) moved = true;
  var m = toModel(e.clientX, e.clientY);
  if (mode === "pan" && pan0){
    var r2 = rect();
    view.x = pan0.x - (e.clientX-down.cx)/r2.width * view.w;
    view.y = pan0.y - (e.clientY-down.cy)/r2.height * view.h;
    touched = true;
    draw(); return;
  }
  if (dragging){
    /* Every line in the set moves by the SAME snapped step. Snapping each line's own ends
       instead would let them drift apart by a half inch each, and a room dragged across the
       sheet would come back a different room. */
    var dx = snap(m.x - dragging.from.x), dy = snap(m.y - dragging.from.y);
    if (dx || dy){
      if (!dragging.pushed){ push(); dragging.pushed = true; }
      dragging.set.forEach(function(l){ moveLine(l, dx, dy); });
      dragging.from = { x:dragging.from.x + dx, y:dragging.from.y + dy };
      draw();
    }
    return;
  }
  if (dragLabel){
    var lx = snap(m.x), ly = snap(m.y);
    if (lx !== dragLabel.x || ly !== dragLabel.y){
      if (!dragLabel.pushed){ push(); dragLabel.pushed = true; }
      dragLabel.x = lx; dragLabel.y = ly; draw();
    }
    return;
  }
  if (grip){
    // the snapshot was taken BEFORE the first step, so the first undo really does undo it
    if (gripMove(grip, m)){
      if (!grip.pushed){ pushState(grip.snap); grip.pushed = true; }
      draw();
    }
    return;
  }
  if (marquee){ marquee.x1 = m.x; marquee.y1 = m.y; draw(); return; }
  if (mode === "draw"){
    var from = chain || (moved ? down.s : null);
    if (from){ var q = snapPoint(m, from); ghost = { x1:from.x, y1:from.y, x2:q.x, y2:q.y }; draw(); }
  }
});

svg.addEventListener("pointerup", function(e){
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) pinch0 = null;
  if (!down) return;
  var m = toModel(e.clientX, e.clientY), d = down; down = null; pan0 = null;
  if (grip){
    var g = grip; grip = null;
    if (g.pushed){
      var lost = gripDone(g);
      save(); draw();
      flash(lost ? lost + " opening" + (lost === 1 ? "" : "s") + " no longer fitted and " +
                   (lost === 1 ? "was" : "were") + " removed."
                 : "That wall is now " + fmt(len(g.l)) + ".");
    } else draw();
    return;
  }
  if (dragging){ dragging = null; save(); draw(); return; }
  if (dragLabel){
    var dl = dragLabel; dragLabel = null; delete dl.pushed;
    if (moved){ save(); draw(); } else openLabel(dl);
    return;
  }
  if (mode === "name"){
    // bare paper: a new name goes down where he tapped, and the editor opens on it
    var t = { id:nid("t"), x:snap(m.x), y:snap(m.y), text:"" };
    push(); labels().push(t); save(); openLabel(t); draw();
    return;
  }
  if (mode === "pan") return;

  if (mode === "trim"){ doTrim(m); return; }

  if (mode === "join"){ doJoin(m); return; }

  if (marquee){
    var box = marquee; marquee = null;
    if (moved) selectIn(box); else { sel = []; closeSheet(); }
    draw(); return;
  }

  if (mode === "select"){
    var h = hit(m);
    sel = h ? [h.line.id] : []; justDrawn = null;
    showSheet();
    draw(); return;
  }

  if (mode === "draw"){
    if (moved && !chain){                           // dragged: one line, done
      var s = d.s || snapPoint(d.m, null);      // the start, snapped
      var q = snapPoint(m, s);                  // square to THAT, not to his finger
      addLine(s, q); ghost = null; draw(); return;
    }
    if (!chain){
      var hp = hit(m);                 // a wall under the tap: that is what he meant
      if (hp){ sel = [hp.line.id]; justDrawn = null; showSheet(); draw(); return; }
      sel = []; closeSheet();          // bare paper: let go of whatever was chosen
    }
    var p = snapPoint(m, chain);
    if (!chain){ chain = p; ghost = null; showLen(true); draw(); return; }
    if (Math.hypot(p.x-chain.x, p.y-chain.y) < MINLEN){   // tapped the same spot: end the chain
      chain = null; ghost = null; showLen(false); draw(); return;
    }
    addLine(chain, p);
    chain = p; ghost = null; draw();
  }
});
svg.addEventListener("pointercancel", function(e){
  delete ptrs[e.pointerId]; down = null; pinch0 = null; grip = null; dragLabel = null;
});

/* THE KEYBOARD. He is at a desk with a mouse as often as on a phone, and Delete is the key
   every drawing program deletes with. Having to find a button in a panel for it - the panel
   that was covering the drawing - is the slowest way to do the commonest thing. */
window.addEventListener("keydown", function(e){
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (!PROJ) return;

  if (e.key === "Escape"){
    chain = null; ghost = null; joinA = null; marquee = null; grip = null;
    sel = []; selLabel = null; justDrawn = null;
    closeSheet(); showLen(false); draw();
    return;
  }
  if ((e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey)){ e.preventDefault(); undo(); return; }

  if (e.key === "Delete" || e.key === "Backspace"){
    var chosen = selLines(), free = chosen.filter(function(l){ return !l.locked; });
    var locked = chosen.length - free.length;
    if (free.length){
      e.preventDefault();
      push();
      var gone = {};
      free.forEach(function(l){ gone[l.id] = 1; });
      PROJ.ops   = ops().filter(function(o){ return !gone[o.line]; });
      PROJ.lines = lines().filter(function(l){ return !gone[l.id]; });
      sel = []; justDrawn = null; closeSheet(); save(); draw();
      flash((free.length === 1 ? "Line deleted." : free.length + " lines deleted.") +
            (locked ? " " + locked + " locked line" + (locked === 1 ? " was" : "s were") +
                      " left alone." : ""));
      return;
    }
    if (locked){ e.preventDefault(); flash("That line is locked. Unlock it first."); return; }
    var t2 = selLabel ? labels().filter(function(q){ return q.id === selLabel; })[0] : null;
    if (t2){
      e.preventDefault();
      push();
      PROJ.labels = labels().filter(function(q){ return q.id !== t2.id; });
      selLabel = null; closeSheet(); save(); draw();
      flash("Name deleted.");
    }
  }
});

/* ---------------------------------------------------------- typed length entry */
var lenBox = document.getElementById("len"), lenv = document.getElementById("lenv");
function showLen(on){ lenBox.classList.toggle("on", on && mode === "draw"); if (on) lenv.value = ""; }
Array.prototype.forEach.call(lenBox.querySelectorAll("button"), function(b){
  b.addEventListener("click", function(){
    if (!chain) return;
    var v = parseFt(lenv.value);
    if (v === null || v < MINLEN){ flash(whyNot(lenv.value)); return; }
    var d = b.getAttribute("data-dir");
    var q = { x:chain.x + (d==="r"?v:d==="l"?-v:0), y:chain.y + (d==="d"?v:d==="u"?-v:0) };
    addLine(chain, q);
    chain = { x:snap(q.x), y:snap(q.y) };
    lenv.value = ""; draw();
  });
});

/* ------------------------------------------------------------------ the sheets */
var sheet = document.getElementById("sheet");
function closeSheet(){ sheet.classList.remove("on"); sheet.innerHTML = ""; sheetKind = null; }
function flash(msg){
  var h = document.getElementById("hint");
  h.textContent = msg;
  clearTimeout(flash.t);
  flash.t = setTimeout(paintHint, 3200);
}
function paintHint(){
  var h = document.getElementById("hint");
  if (!PROJ){ h.textContent = ""; return; }
  h.textContent = mode === "draw"
      ? (chain ? "Tap the next corner — or type a size and an arrow. Tap the same spot to stop."
         : sel.length === 1
           ? "Drag an end to stretch it, or drag the wall to move it. Delete removes it."
           : "Drag to draw a wall. Tap a wall to pick it up. Tap bare paper to start a chain.")
    : mode === "join" ? (joinA ? "Now tap the other line. The ends you tapped are the ends that stay."
                               : "Tap one line, then the other. Both run out to meet in a corner.")
    : mode === "trim" ? "Tap the piece to rub out. It stops at the lines that cross it."
    : mode === "name" ? "Tap inside a room to name it. Drag a name to move it, tap it to change it."
    : mode === "select" ? (sel.length > 1
        ? sel.length + " chosen. Drag any one to move them all."
        : "Drag a box. Left to right takes what is wholly inside; right to left takes everything it touches.")
    : "Drag to move the sheet. Two fingers to zoom.";
}

function showSheet(){
  var s = selLines();
  if (!s.length) closeSheet();
  else if (s.length === 1) openLine(s[0]);
  else openMany(s);
}

/* Several lines at once. Only the things that mean the same for all of them are offered:
   a thickness, a kind, a colour, a lock, a delete. NOT a length - "set them all to 10'-0"" is
   almost never what anyone means, and it would quietly destroy a room. */
function openMany(s){
  sheet.classList.add("on");
  sheetKind = "many";
  sheet.innerHTML = "";
  var walls = s.filter(function(l){ return l.kind === "wall"; });
  var total = s.reduce(function(t, l){ return t + len(l); }, 0);
  var h3 = document.createElement("h3");
  h3.textContent = s.length + " lines chosen  —  " + walls.length + " wall" +
                   (walls.length === 1 ? "" : "s") + ", " + fmt(total) + " altogether";
  sheet.appendChild(h3);

  function bulk(fn){ push(); s.forEach(fn); save(); draw(); openMany(selLines()); }

  var r2 = document.createElement("div"); r2.className = "row";
  [["wall","All wall lines"],["ref","All reference lines"]].forEach(function(k){
    var b = document.createElement("button");
    b.textContent = k[1];
    b.setAttribute("aria-pressed", s.every(function(l){ return l.kind === k[0]; }) ? "true" : "false");
    b.addEventListener("click", function(){ bulk(function(l){ l.kind = k[0]; }); });
    r2.appendChild(b);
  });
  sheet.appendChild(r2);

  if (walls.length){
    var r3 = document.createElement("div"); r3.className = "row";
    var lb = document.createElement("span"); lb.className = "note";
    lb.textContent = "Thickness of the " + walls.length + " wall" + (walls.length === 1 ? "" : "s");
    r3.appendChild(lb);
    THICK.forEach(function(t){
      var b = document.createElement("button");
      b.textContent = inchText(t);
      b.setAttribute("aria-pressed", walls.every(function(l){ return l.t === t; }) ? "true" : "false");
      b.addEventListener("click", function(){
        bulk(function(l){ if (l.kind === "wall") l.t = t; });
      });
      r3.appendChild(b);
    });
    sheet.appendChild(r3);
  }

  var r4 = document.createElement("div"); r4.className = "row";
  var cl = document.createElement("span"); cl.className = "note"; cl.textContent = "Colour"; r4.appendChild(cl);
  COLORS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "sw"; b.style.background = c; b.setAttribute("aria-label", c);
    b.setAttribute("aria-pressed", s.every(function(l){ return l.color === c; }) ? "true" : "false");
    b.addEventListener("click", function(){ bulk(function(l){ l.color = c; }); });
    r4.appendChild(b);
  });
  sheet.appendChild(r4);

  var r7 = document.createElement("div"); r7.className = "row";
  var lk = document.createElement("button");
  lk.textContent = "Lock all";
  lk.addEventListener("click", function(){
    push(); s.forEach(function(l){ l.locked = true; }); sel = []; save(); closeSheet(); draw();
    flash(s.length + " lines locked.");
  });
  var del = document.createElement("button");
  del.textContent = "Delete all " + s.length;
  del.addEventListener("click", function(){
    push();
    var ids = s.map(function(l){ return l.id; });
    PROJ.ops = ops().filter(function(o){ return ids.indexOf(o.line) < 0; });
    PROJ.lines = lines().filter(function(l){ return ids.indexOf(l.id) < 0; });
    sel = []; save(); closeSheet(); draw();
  });
  var cl2 = document.createElement("button"); cl2.className = "ghost"; cl2.textContent = "Close";
  cl2.addEventListener("click", function(){ sel = []; closeSheet(); draw(); });
  r7.appendChild(lk); r7.appendChild(del); r7.appendChild(cl2);
  sheet.appendChild(r7);

  var n = document.createElement("div"); n.className = "note";
  n.textContent = "Drag any one of them to move them all together.";
  sheet.appendChild(n);
}

function openLine(l){
  if (!l) return;
  sheet.classList.add("on");
  sheetKind = "line";
  sheet.innerHTML = "";
  var h3 = document.createElement("h3");
  h3.textContent = (l.kind === "wall" ? "Wall " + inchText(l.t) : "Reference line") + "  —  " + fmt(len(l));
  sheet.appendChild(h3);

  // length
  var r1 = document.createElement("div"); r1.className = "row";
  var inp = document.createElement("input"); inp.type = "text"; inp.value = fmt(len(l)).replace(/'-/, "-").replace(/"$/, "");
  var set = document.createElement("button"); set.textContent = "Set length";
  var err = document.createElement("span"); err.className = "err";
  set.addEventListener("click", function(){
    var v = parseFt(inp.value);
    if (v === null){ err.textContent = whyNot(inp.value); return; }
    if (l.locked){ err.textContent = "Locked."; return; }
    if (!setLength(l, v)){ err.textContent = "Too short."; return; }
    err.textContent = ""; draw(); openLine(l);
  });
  r1.appendChild(inp); r1.appendChild(set); r1.appendChild(err);
  sheet.appendChild(r1);

  // kind + thickness
  var r2 = document.createElement("div"); r2.className = "row";
  [["wall","Wall line"],["ref","Reference line"]].forEach(function(k){
    var b = document.createElement("button");
    b.textContent = k[1]; b.setAttribute("aria-pressed", l.kind === k[0] ? "true" : "false");
    b.addEventListener("click", function(){
      if (l.locked) return flash("Locked.");
      push(); l.kind = k[0]; save(); draw(); openLine(l);
    });
    r2.appendChild(b);
  });
  sheet.appendChild(r2);

  if (l.kind === "wall"){
    var r3 = document.createElement("div"); r3.className = "row";
    var lb = document.createElement("span"); lb.className = "note"; lb.textContent = "Thickness"; r3.appendChild(lb);
    THICK.forEach(function(t){
      var b = document.createElement("button");
      b.textContent = inchText(t); b.setAttribute("aria-pressed", l.t === t ? "true" : "false");
      b.addEventListener("click", function(){
        if (l.locked) return flash("Locked.");
        push(); l.t = t; save(); draw(); openLine(l);
      });
      r3.appendChild(b);
    });
    sheet.appendChild(r3);
  }

  // colour
  var r4 = document.createElement("div"); r4.className = "row";
  var cl = document.createElement("span"); cl.className = "note"; cl.textContent = "Colour"; r4.appendChild(cl);
  COLORS.forEach(function(c){
    var b = document.createElement("button");
    b.className = "sw"; b.style.background = c;
    b.setAttribute("aria-pressed", l.color === c ? "true" : "false");
    b.setAttribute("aria-label", c);
    b.addEventListener("click", function(){
      if (l.locked) return flash("Locked.");
      push(); l.color = c; save(); draw(); openLine(l);
    });
    r4.appendChild(b);
  });
  sheet.appendChild(r4);

  // door / window
  if (l.kind === "wall"){
    var r5 = document.createElement("div"); r5.className = "row";
    var dw = document.createElement("input"); dw.type = "text"; dw.placeholder = "size  3-0";
    var df = document.createElement("input"); df.type = "text"; df.placeholder = "from end  2-0";
    var bd = document.createElement("button"); bd.textContent = "Door";
    var bw = document.createElement("button"); bw.textContent = "Window";
    var e2 = document.createElement("span"); e2.className = "err";
    function place(k){
      var w = parseFt(dw.value), f = parseFt(df.value);
      if (w === null){ e2.textContent = whyNot(dw.value); return; }
      if (f === null){ e2.textContent = "Where from the first end? Try 2-0."; return; }
      if (!addOpening(l, k, w, f)){
        e2.textContent = "That does not fit on a " + fmt(len(l)) + " wall.";
        return;
      }
      e2.textContent = ""; draw(); openLine(l);
    }
    bd.addEventListener("click", function(){ place("door"); });
    bw.addEventListener("click", function(){ place("window"); });
    r5.appendChild(dw); r5.appendChild(df); r5.appendChild(bd); r5.appendChild(bw); r5.appendChild(e2);
    sheet.appendChild(r5);

    var mine = ops().filter(function(o){ return o.line === l.id; });
    if (mine.length){
      var r6 = document.createElement("div"); r6.className = "row";
      mine.forEach(function(o){
        var b = document.createElement("button");
        b.textContent = (o.kind === "door" ? "D " : "W ") + fmt(o.w) + " ×";
        b.addEventListener("click", function(){
          push();
          PROJ.ops = ops().filter(function(q){ return q.id !== o.id; });
          save(); draw(); openLine(l);
        });
        r6.appendChild(b);
      });
      sheet.appendChild(r6);
    }
  }

  // lock / delete / close
  var r7 = document.createElement("div"); r7.className = "row";
  var lk = document.createElement("button");
  lk.textContent = l.locked ? "Unlock" : "Lock";
  lk.setAttribute("aria-pressed", l.locked ? "true" : "false");
  lk.addEventListener("click", function(){ push(); l.locked = !l.locked; save(); draw(); openLine(l); });
  var del = document.createElement("button");
  del.textContent = "Delete whole line";
  del.addEventListener("click", function(){
    if (l.locked) return flash("Locked. Unlock it first.");
    removeLine(l);
  });
  var cl2 = document.createElement("button"); cl2.className = "ghost"; cl2.textContent = "Close";
  cl2.addEventListener("click", function(){ sel = []; closeSheet(); draw(); });
  r7.appendChild(lk); r7.appendChild(del); r7.appendChild(cl2);
  sheet.appendChild(r7);
}

/* ---------------------------------------------------------------- the options bar */
function paintOpts(){
  var bar = document.getElementById("opts");
  bar.innerHTML = "";
  function lbl(t){ var s = document.createElement("span"); s.className = "lbl"; s.textContent = t; bar.appendChild(s); }
  function btn(text, on, fn, cls){
    var b = document.createElement("button");
    if (cls) b.className = cls; else b.textContent = text;
    if (cls) b.setAttribute("aria-label", text);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.addEventListener("click", fn);
    bar.appendChild(b); return b;
  }
  lbl("New line");
  [["wall","Wall"],["ref","Ref"]].forEach(function(k){
    btn(k[1], kind === k[0], function(){ kind = k[0]; paintOpts(); draw(); });
  });
  THICK.forEach(function(t){
    var b = btn(inchText(t), kind === "wall" && thick === t, function(){ thick = t; kind = "wall"; paintOpts(); draw(); });
    b.disabled = false;
  });
  COLORS.forEach(function(c){
    var b = btn(c, color === c, function(){ color = c; paintOpts(); }, "sw");
    b.style.background = c;
  });
  // the 90 degree lock lives in the tools row, not here: it decides every line he draws, and
  // on a phone this bar scrolls, so after six colour swatches it was off the edge of the screen.
}

/* ------------------------------------------------------------------- the menu */
/* The editor for one room name. The size under the name is not typed and cannot be typed:
   it is measured from where the name sits out to the nearest wall on all four sides, so it
   follows the walls when they move. A size he could type would be a size that stopped being
   true the moment he dragged a wall, with nothing on the drawing to say so. */
function openLabel(t){
  selLabel = t.id;
  var pushed = false;
  sheet.classList.add("on");
  sheetKind = "label";
  sheet.innerHTML = "";
  var h3 = document.createElement("h3"); h3.textContent = "Room name"; sheet.appendChild(h3);

  var r1 = document.createElement("div"); r1.className = "row";
  var inp = document.createElement("input"); inp.type = "text"; inp.value = t.text || "";
  inp.placeholder = "BEDROOM"; inp.style.width = "11em";
  inp.addEventListener("input", function(){
    if (!pushed){ push(); pushed = true; }
    t.text = inp.value; save(); draw();
  });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") inp.blur(); });
  r1.appendChild(inp);
  sheet.appendChild(r1);

  var size = roomSizeAt(t);
  var note = document.createElement("div"); note.className = "note";
  note.textContent = size
    ? "Size here: " + fmt(size.w) + " \u00d7 " + fmt(size.h) +
      " — measured to the near face of the wall on each side."
    : "No size shown: one of the four sides is open, so this is not a closed room yet.";
  sheet.appendChild(note);

  var r2 = document.createElement("div"); r2.className = "row"; r2.style.marginTop = "8px";
  var del = document.createElement("button"); del.textContent = "Delete";
  del.addEventListener("click", function(){
    push();
    PROJ.labels = labels().filter(function(q){ return q.id !== t.id; });
    selLabel = null; save(); closeSheet(); draw();
  });
  var cl = document.createElement("button"); cl.className = "ghost"; cl.textContent = "Close";
  cl.addEventListener("click", function(){ selLabel = null; closeSheet(); draw(); });
  r2.appendChild(del); r2.appendChild(cl);
  sheet.appendChild(r2);
  inp.focus();
}

/* REFERENCE LINES AS A GROUP. They are guides - drawn to set things out, and then in the
   way. Hiding them, locking them so a stray tap cannot move them, and clearing them out when
   they have done their job are three different things he may want, so all three are here
   rather than one button guessing which he meant. */
function openRefs(){
  sheet.classList.add("on");
  sheetKind = "refs";
  sheet.innerHTML = "";
  var refs = lines().filter(function(l){ return l.kind === "ref"; });
  var lockedN = refs.filter(function(l){ return l.locked; }).length;
  var h3 = document.createElement("h3");
  h3.textContent = "Reference lines — " + (refs.length || "none");
  sheet.appendChild(h3);

  var r1 = document.createElement("div"); r1.className = "row";
  var hide = document.createElement("button");
  hide.textContent = PROJ.refHidden ? "Show them" : "Hide them";
  hide.setAttribute("aria-pressed", PROJ.refHidden ? "true" : "false");
  hide.disabled = !refs.length;
  hide.addEventListener("click", function(){
    PROJ.refHidden = !PROJ.refHidden;
    // a line he cannot see must not stay chosen: the next bulk change would land on it
    sel = selLines().filter(visible).map(function(l){ return l.id; });
    save(); openRefs(); draw();
  });
  r1.appendChild(hide);

  var lock = document.createElement("button");
  lock.textContent = (lockedN === refs.length && refs.length) ? "Unlock all" : "Lock all";
  lock.disabled = !refs.length;
  lock.addEventListener("click", function(){
    var toLock = !(lockedN === refs.length && refs.length);
    push();
    refs.forEach(function(l){ l.locked = toLock; });
    sel = []; save(); openRefs(); draw();
    flash(toLock ? refs.length + " reference line" + (refs.length === 1 ? "" : "s") + " locked."
                 : "Reference lines unlocked.");
  });
  r1.appendChild(lock);
  sheet.appendChild(r1);

  var r2 = document.createElement("div"); r2.className = "row";
  var del = document.createElement("button");
  del.textContent = "Delete them all";
  del.disabled = !refs.length;
  del.addEventListener("click", function(){
    if (!confirm("Delete all " + refs.length + " reference line" +
                 (refs.length === 1 ? "" : "s") + "? This cannot be undone from another device."))
      return;
    push();
    var gone = {};
    refs.forEach(function(l){ gone[l.id] = 1; });
    PROJ.ops   = ops().filter(function(o){ return !gone[o.line]; });
    PROJ.lines = lines().filter(function(l){ return !gone[l.id]; });
    sel = []; PROJ.refHidden = false;
    save(); openRefs(); draw();
    flash(refs.length + " reference line" + (refs.length === 1 ? "" : "s") + " deleted.");
  });
  var cl = document.createElement("button"); cl.className = "ghost"; cl.textContent = "Close";
  cl.addEventListener("click", function(){ closeSheet(); draw(); });
  r2.appendChild(del); r2.appendChild(cl);
  sheet.appendChild(r2);

  var note = document.createElement("div"); note.className = "note";
  note.textContent = refs.length
    ? "Hidden, they are not drawn and cannot be tapped, caught by a box or snapped to — but they are still in the drawing."
    : "A reference line is drawn with the Ref button on the New line row. It is a guide: it carries no thickness and closes no room.";
  sheet.appendChild(note);
}

function openProjects(){
  sheet.classList.add("on");
  sheetKind = "projects";
  sheet.innerHTML = "";
  var h3 = document.createElement("h3"); h3.textContent = "Projects"; sheet.appendChild(h3);

  /* THE SETBACK, for the project that is open. Four sides, named by the screen - top,
     right, bottom, left - because "front" depends on which way the plot faces and a
     setback written on the wrong side is worse than none. Blank counts as nothing. */
  if (PROJ){
    var cur = sb();
    var rs = document.createElement("div"); rs.className = "row";
    var sl = document.createElement("span"); sl.className = "note"; sl.textContent = "Setback";
    rs.appendChild(sl);
    var box = {};
    [["t","top"],["r","right"],["b","bottom"],["l","left"]].forEach(function(k){
      var i = document.createElement("input");
      i.type = "text"; i.style.width = "5.4em"; i.placeholder = k[1];
      i.value = cur[k[0]] ? fmtShort(cur[k[0]]) : "";
      box[k[0]] = i; rs.appendChild(i);
    });
    var setb = document.createElement("button"); setb.textContent = "Set";
    var ers = document.createElement("span"); ers.className = "err";
    setb.addEventListener("click", function(){
      var v = {}, bad = null;
      ["t","r","b","l"].forEach(function(k){
        var raw = box[k].value.trim();
        if (!raw){ v[k] = 0; return; }
        var f = parseFt(raw);
        if (f === null || f < 0){ if (!bad) bad = whyNot(raw); return; }
        v[k] = snap(f);
      });
      if (bad){ ers.textContent = bad; return; }
      if (v.l + v.r >= PROJ.W || v.t + v.b >= PROJ.H){
        ers.textContent = "Those setbacks leave nothing to build on.";
        return;
      }
      PROJ.sb = v; save();
      document.getElementById("psize").textContent = sizeText();
      openProjects(); draw();
    });
    rs.appendChild(setb); rs.appendChild(ers);
    sheet.appendChild(rs);
    var sn = document.createElement("div"); sn.className = "note"; sn.style.marginBottom = "10px";
    sn.textContent = "The buildable area is the plot pulled in by these. Leave them blank and " +
                     "every gap is measured to the plot line instead.";
    sheet.appendChild(sn);
  }

  var s = store();
  s.list.forEach(function(p){
    var r = document.createElement("div"); r.className = "row";
    var b = document.createElement("button");
    b.textContent = p.name + "   " + fmt(p.W) + " × " + fmt(p.H);
    b.setAttribute("aria-pressed", PROJ && p.id === PROJ.id ? "true" : "false");
    b.addEventListener("click", function(){ open(p.id); });
    var x = document.createElement("button"); x.className = "ghost"; x.textContent = "×";
    x.addEventListener("click", function(){
      if (!confirm("Delete the project “" + p.name + "”? This cannot be undone.")) return;
      var st = store();
      st.list = st.list.filter(function(q){ return q.id !== p.id; });
      writeStore(st);
      if (db) db.doc("projects/" + p.id).delete().catch(function(){});
      if (PROJ && PROJ.id === p.id){ PROJ = null; }
      openProjects();
      if (!PROJ && st.list.length) open(st.list[0].id); else if (!PROJ) draw();
    });
    r.appendChild(b); r.appendChild(x);
    sheet.appendChild(r);
  });
  var r2 = document.createElement("div"); r2.className = "row";
  var nm = document.createElement("input"); nm.type = "text"; nm.placeholder = "Name"; nm.style.width = "9em";
  var w = document.createElement("input"); w.type = "text"; w.placeholder = "width  40";
  var h = document.createElement("input"); h.type = "text"; h.placeholder = "depth  60";
  var mk = document.createElement("button"); mk.textContent = "New project";
  var er = document.createElement("span"); er.className = "err";
  mk.addEventListener("click", function(){
    var W = parseFt(w.value), H = parseFt(h.value);
    if (!nm.value.trim()){ er.textContent = "Give it a name."; return; }
    if (W === null){ er.textContent = whyNot(w.value); return; }
    if (H === null){ er.textContent = whyNot(h.value); return; }
    var p = newProject(nm.value.trim(), W, H);
    var st = store(); st.list.push(p); st.open = p.id; writeStore(st);
    open(p.id);
  });
  r2.appendChild(nm); r2.appendChild(w); r2.appendChild(h); r2.appendChild(mk); r2.appendChild(er);
  sheet.appendChild(r2);
  var n = document.createElement("div"); n.className = "note";
  n.textContent = "Sizes in feet-inches: 40, or 33-6. The plot is the dotted outline; lines may be drawn anywhere.";
  sheet.appendChild(n);
}

function open(id){
  var s = store(), p = null;
  s.list.forEach(function(q){ if (q.id === id) p = q; });
  if (!p) return;
  PROJ = p; PROJ.ops = PROJ.ops || []; PROJ.lines = PROJ.lines || []; PROJ.seq = PROJ.seq || 1;
  PROJ.labels = PROJ.labels || []; PROJ.sb = PROJ.sb || { t:0, r:0, b:0, l:0 };
  s.open = id; writeStore(s);
  sel = []; chain = null; ghost = null; undoStack = []; justDrawn = null; selLabel = null;
  document.getElementById("undo").disabled = true;
  document.getElementById("pname").textContent = PROJ.name;
  document.getElementById("psize").textContent = sizeText();
  closeSheet(); showLen(false); fit();
}

/* -------------------------------------------------------------------- wiring */
/* Pan sits OUTSIDE the scrolling list, beside 90 degrees and Fit. Adding Name made six
   modes, and the sixth went off the edge of a phone - which is exactly how the 90 degree
   lock came to be reported as missing when it had been there all along. */
Array.prototype.forEach.call(document.querySelectorAll("#tools button[data-mode]"), function(b){
  b.addEventListener("click", function(){
    mode = b.getAttribute("data-mode");
    Array.prototype.forEach.call(document.querySelectorAll("#tools button[data-mode]"), function(o){
      o.setAttribute("aria-pressed", o === b ? "true" : "false");
    });
    chain = null; ghost = null; joinA = null; justDrawn = null; selLabel = null; showLen(false);
    if (mode !== "select"){ sel = []; closeSheet(); }
    draw();
  });
});
document.getElementById("ortho").addEventListener("click", function(){
  ortho = !ortho;
  this.setAttribute("aria-pressed", ortho ? "true" : "false");
  flash(ortho ? "Every line locked to 90°." : "90° lock off — lines go where you put them.");
  draw();
});
document.getElementById("fit").addEventListener("click", fit);
document.getElementById("refbtn").addEventListener("click", openRefs);
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("menu").addEventListener("click", openProjects);
window.addEventListener("resize", function(){
  // Turning the phone, or opening the keyboard, changes the shape of the screen under a view
  // that was fitted to the old one. If he has not moved the view himself there is nothing to
  // preserve, so fit it again - better than showing him a plot that has slid off the edge.
  if (!touched){ fit(); return; }
  var cx = view.x + view.w/2, cy = view.y + view.h/2;   // his own zoom: keep the middle
  syncView();
  view.x = cx - view.w/2; view.y = cy - view.h/2;
  draw();
});

paintOpts();
(function start(){
  var s = store();
  if (!s.list.length){
    // one project to land in, so the first tap draws something instead of asking a question
    var p = newProject("Sketch 1", 40*12, 60*12);
    INVENTED = p.id;                 // nobody asked for this one; the store may hold better
    s.list.push(p); s.open = p.id; writeStore(s);
  }
  open(s.open || s.list[0].id);
  document.getElementById("undo").disabled = true;
  paintSaveWarning();
})();

/* The artifact store is a copy of what the browser holds. A copy that is only ever written
   is not a copy: clear this tablet's site data, or open the same link on the phone, and the
   local list is empty while the drawings sit safe in the store with no road back to them.
   So the FIRST thing asked of the store is the list of projects, not one project by id. */
(async function(){
  try {
    db = await claude.use("db");
    paintSaveWarning();
    if (!db) return;
    var snap = await db.collection("projects").get();
    var raw = (snap && snap.docs) ? snap.docs : (Array.isArray(snap) ? snap : []);
    var remote = raw.map(function(d){ return (d && typeof d.data === "function") ? d.data() : d; })
                    .filter(function(p){ return p && p.id && p.name; })
                    .sort(function(a, b){ return a.id < b.id ? -1 : 1; });

    var s = store(), known = {}, added = 0;
    s.list.forEach(function(p){ known[p.id] = true; });
    remote.forEach(function(p){
      if (known[p.id]) return;                       // what is here already wins: local is primary
      p.lines = p.lines || []; p.ops = p.ops || []; p.seq = p.seq || 1;
      p.labels = p.labels || []; p.sb = p.sb || { t:0, r:0, b:0, l:0 };
      s.list.push(p); added++;
    });

    if (added){
      // the blank project made a moment ago for a first visit was a guess; his own work beats it
      var inv = null;
      if (INVENTED) s.list.forEach(function(q){ if (q.id === INVENTED) inv = q; });
      if (inv && !inv.lines.length && !inv.ops.length){
        s.list = s.list.filter(function(q){ return q.id !== INVENTED; });
        INVENTED = null;
        writeStore(s);
        open(s.list[s.list.length - 1].id);
      } else {
        writeStore(s);
        if (sheetKind === "projects") openProjects();
      }
      flash(added + (added === 1 ? " project" : " projects") + " brought back from the store.");
    }

    // and the open project, in case this device has its name but not its latest lines
    if (PROJ && !PROJ.lines.length){
      var one = await db.doc("projects/" + PROJ.id).get();
      var d = one && one.data ? one.data() : null;
      if (d && d.lines && d.lines.length){ PROJ.lines = d.lines; PROJ.ops = d.ops || []; draw(); }
    }
  } catch (e){ db = null; paintSaveWarning(); }
})();
</script>

</body>
